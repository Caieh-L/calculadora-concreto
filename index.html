<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Traço Brasil V2</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; width: 100%; max-width: 450px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1e293b; font-size: 20px; margin-bottom: 15px; }
        h3 { font-size: 14px; color: #64748b; margin: 10px 0 5px 0; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
        .row { display: flex; gap: 10px; }
        button { width: 100%; background-color: #059669; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .results { margin-top: 20px; padding: 15px; background-color: #ecfdf5; border-left: 4px solid #059669; border-radius: 4px; display: none; }
        .item { font-size: 15px; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .bold { font-weight: bold; color: #065f46; }
        .alert { font-size: 12px; color: #b45309; background-color: #fffbeb; padding: 8px; border-radius: 4px; margin-top: 5px; border-left: 3px solid #f59e0b; }
    </style>
</head>
<body>

<div class="card">
    <h1>🧮 Calculadora de Traço Brasil</h1>
    
    <h3>1. Materiais</h3>
    <label style="font-size:12px; font-weight:bold; color:#64748b;">Agregado Graúdo:</label>
    <select id="tipoAgregado" onchange="ajustarCampos()">
        <option value="brita">Brita Comercial</option>
        <option value="seixo">Seixo Rolado</option>
        <option value="misto">Seixo Misto (Já vem misturado)</option>
    </select>

    <label style="font-size:12px; font-weight:bold; color:#64748b;">Tipo de Cimento Portland:</label>
    <select id="tipoCimento" onchange="mostrarAvisoCimento()">
        <option value="cp2">CP II (Composto - Padrão)</option>
        <option value="cp3">CP III (Alto Forno/Escória)</option>
        <option value="cp4">CP IV (Pozolânico)</option>
        <option value="cp5">CP V-ARI (Alta Resistência Inicial)</option>
    </select>
    <div id="avisoCimento" class="alert" style="display:none;"></div>

    <h3>2. Aditivo Plastificante</h3>
    <select id="usaAditivo" onchange="ajustarAditivo()">
        <option value="nao">Não usar aditivo</option>
        <option value="sim">Usar Aditivo Plastificante</option>
    </select>
    <div id="campoDosagemAditivo" style="display:none;">
        <label style="font-size:12px; font-weight:bold; color:#64748b;">Dosagem (% do peso do cimento. Ex: 0.5):</label>
        <input type="number" id="dosagemAditivo" value="0.5" step="0.1">
    </div>

    <h3>3. Volume e Perda</h3>
    <div class="row">
        <input type="number" id="volume" placeholder="Volume m³" value="1">
        <input type="number" id="perda" placeholder="Perda %" value="5">
    </div>

    <h3>4. Proporção do Traço (Cimento : Areia : Pedra)</h3>
    <div class="row">
        <input type="number" value="1" disabled style="background:#f1f5f9; text-align:center;">
        <input type="number" id="tracoAreia" placeholder="Areia" value="2">
        <input type="number" id="tracoPedra" placeholder="Pedra/Seixo" value="3">
    </div>

    <h3>5. Água e Umidade da Areia</h3>
    <div class="row">
        <input type="number" id="fc" placeholder="Água/Cimento" value="0.55" step="0.01">
        <input type="number" id="umidade" placeholder="Umidade Areia %" value="0">
    </div>

    <button onclick="calcularObra()">Calcular Traço</button>

    <div class="results" id="caixaResultado">
        <div class="item">Sacos de Cimento (50kg): <span class="bold" id="rCimento">0</span></div>
        <div class="item" id="linhaAditivo" style="display:none; background:#fef3c7; padding:4px; border-radius:4px;">Aditivo Plastificante: <span class="bold" id="rAditivo" style="color:#b45309;">0 ml</span></div>
        <div class="item">Latas de Areia (18L): <span class="bold" id="rAreia">0</span></div>
        <div class="item" id="linhaPedra">Latas de Pedra (18L): <span class="bold" id="rPedra">0</span></div>
        <div class="item">Água para colocar (Litros): <span class="bold" id="rAgua">0</span></div>
    </div>
</div>

<script>
function mostrarAvisoCimento() {
    const cimento = document.getElementById('tipoCimento').value;
    const aviso = document.getElementById('avisoCimento');
    
    if(cimento === 'cp3') {
        aviso.innerText = "ℹ️ CP III: Liberação de calor lenta. Exige manter molhado (cura) por mais dias.";
        aviso.style.display = 'block';
    } else if(cimento === 'cp4') {
        aviso.innerText = "ℹ️ CP IV: Alta durabilidade contra ataques químicos. Ganho de força mais lento.";
        aviso.style.display = 'block';
    } else if(cimento === 'cp5') {
        aviso.innerText = "ℹ️ CP V-ARI: Ganha muita força nos primeiros dias. Cuidado com desforma rápida.";
        aviso.style.display = 'block';
    } else {
        aviso.style.display = 'none';
    }
}

function ajustarCampos() {
    const tipo = document.getElementById('tipoAgregado').value;
    const campoPedra = document.getElementById('tracoPedra');
    const linhaPedra = document.getElementById('linhaPedra');
    
    if (tipo === 'misto') {
        campoPedra.style.display = 'none';
        linhaPedra.style.display = 'none';
    } else {
        campoPedra.style.display = 'block';
        linhaPedra.style.display = 'flex';
    }
}

function ajustarAditivo() {
    const usa = document.getElementById('usaAditivo').value;
    document.getElementById('campoDosagemAditivo').style.display = (usa === 'sim') ? 'block' : 'none';
}

function calcularObra() {
    const tipo = document.getElementById('tipoAgregado').value;
    const cimento = document.getElementById('tipoCimento').value;
    const usaAditivo = document.getElementById('usaAditivo').value;
    let V = parseFloat(document.getElementById('volume').value) || 0;
    const perda = parseFloat(document.getElementById('perda').value) || 0;
    const m_areia = parseFloat(document.getElementById('tracoAreia').value) || 0;
    let m_pedra = parseFloat(document.getElementById('tracoPedra').value) || 0;
    let ac = parseFloat(document.getElementById('fc').value) || 0;
    const h = (parseFloat(document.getElementById('umidade').value) || 0) / 100;

    V = V * (1 + (perda / 100));

    // Ajusta a Massa Específica baseada no tipo de cimento real do laboratório
    let rho_ci = 3.10; // Padrão CP II
    if (cimento === 'cp3') rho_ci = 2.95; // Mais leve devido à escória
    if (cimento === 'cp4') rho_ci = 3.00; // Pozolânico
    if (cimento === 'cp5') rho_ci = 3.15; // Finura maior/ARI

    const rho_ar = 2.65;
    let rho_pe = 2.70; 
    
    if (tipo === 'seixo') rho_pe = 2.60;
    if (tipo === 'misto') {
        rho_pe = 2.63; 
        m_pedra = 0; 
    }

    const gama_ar = 1.45;
    let gama_pe = (tipo === 'seixo') ? 1.50 : 1.40;

    let inchamento = 1.0;
    if (h > 0) inchamento = 1.25; 

    // Regra de engenharia do Aditivo Plastificante:
    // Ele reduz a necessidade de água da betoneira mantendo a mesma força do cimento!
    let fatorReducaoAgua = 1.0;
    if (usaAditivo === 'sim') {
        fatorReducaoAgua = 0.88; // Reduz em média 12% da água necessária
    }

    const agua_projeto_m3 = ac * fatorReducaoAgua;

    // Fórmula Universal do Volume Absoluto recalculada com os novos pesos e água reduzida
    const vol_especifico = (1 / rho_ci) + (m_areia / rho_ar) + (m_pedra / rho_pe) + agua_projeto_m3;
    const cimento_por_m3 = 1000 / vol_especifico;

    const peso_ci = cimento_por_m3 * V;
    let peso_ar = peso_ci * m_areia;
    const peso_pe = peso_ci * m_pedra;

    let agua_na_areia = 0;
    if (h > 0) {
        agua_na_areia = peso_ar * h;
        peso_ar = peso_ar * (1 + h);
    }

    // Calcula a água total limpa a ser adicionada
    const agua_real = Math.max(0, (peso_ci * agua_projeto_m3) - agua_na_areia);

    // Calcula a dosagem do aditivo em ml (baseado no peso do cimento)
    let ml_aditivo = 0;
    if (usaAditivo === 'sim') {
        const pct_adit = parseFloat(document.getElementById('dosagemAditivo').value) || 0.5;
        ml_aditivo = peso_ci * (pct_adit / 100) * 1000; // converte kg para ml
    }

    const sacos = peso_ci / 50;
    const latas_areia = ((peso_ar / gama_ar) / 18) * inchamento;
    const latas_pedra = (peso_pe / gama_pe) / 18;

    // Joga os resultados na tela
    document.getElementById('rCimento').innerText = sacos.toFixed(1) + " sc";
    document.getElementById('rAreia').innerText = latas_areia.toFixed(1) + " latas";
    if (tipo !== 'misto') {
        document.getElementById('rPedra').innerText = latas_pedra.toFixed(1) + " latas";
    }
    document.getElementById('rAgua').innerText = agua_real.toFixed(0) + " Litros";

    // Mostra ou esconde a linha do aditivo nos resultados
    if (usaAditivo === 'sim') {
        document.getElementById('rAditivo').innerText = ml_aditivo.toFixed(0) + " ml";
        document.getElementById('linhaAditivo').style.display = 'flex';
    } else {
        document.getElementById('linhaAditivo').style.display = 'none';
    }

    document.getElementById('caixaResultado').style.display = 'block';
}
</script>

</body>
</html>
